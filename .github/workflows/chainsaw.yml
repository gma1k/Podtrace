name: Chainsaw e2e

on:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "assets/**"
      - "examples/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - "LICENSE"
      - "AUTHORS"
      - "CODEOWNERS"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "assets/**"
      - "examples/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - "LICENSE"
      - "AUTHORS"
      - "CODEOWNERS"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_FIXTURE_IMAGES: >-
    nginx:1.29
    nginx:1.27-alpine
    alpine/k8s:1.30.4
    polinux/stress:1.0.4
    busybox:1.36
    curlimages/curl:8.9.1
    python:3.12-alpine
    registry.k8s.io/pause:3.9
    chrislusf/seaweedfs:3.93

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chainsaw:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CHAINSAW_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    name: chainsaw (shard ${{ matrix.shard }}/4)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Preload kind node image
        uses: ./.github/actions/preload-kind-node

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          cluster_name: podtrace-chainsaw
          config: ./test/chainsaw/kind-config.yaml
          version: v0.33.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.1

      - name: Install chainsaw
        run: |
          set -euo pipefail

          ver="v0.2.15"
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64) want="295d226c89f126c0a97775d364be149f47a810c8a3f9829ee410583d0c1abe3c" ;;
            arm64) want="fecf5f3ea74d11da2cd5d95a4c016d5d2543cbc4844ce21adf5e727e7ffd9e44" ;;
            *) echo "::error::no pinned chainsaw for arch ${arch}"; exit 1 ;;
          esac

          url="https://github.com/kyverno/chainsaw/releases/download/${ver}/chainsaw_linux_${arch}.tar.gz"
          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${tmp}"
          if ! echo "${want}  ${tmp}" | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::chainsaw ${ver} ${arch} checksum mismatch; refusing to install"
            rm -f "${tmp}"
            exit 1
          fi
          sudo tar -C /usr/local/bin -xzf "${tmp}" chainsaw
          sudo chmod 0755 /usr/local/bin/chainsaw
          rm -f "${tmp}"
          chainsaw version

      - name: Build podtrace image
        run: make docker-build IMAGE_TAG=ci

      - name: Build workload fixture images
        run: |
          set -euo pipefail
          docker build --provenance=false \
            -t podtrace-h2demo:ci \
            test/chainsaw/tests/h2-capture/workload
          docker build --provenance=false \
            -t podtrace-otlp-sink:ci \
            test/chainsaw/tests/otlp-sink/workload
          docker build --provenance=false \
            -t podtrace-h3curl:ci \
            test/chainsaw/tests/h3-adapter-capture/workload-curl
          docker build --provenance=false \
            -t podtrace-h3server:ci \
            test/chainsaw/tests/h3-nghttp3-server/workload-server
          docker build --provenance=false \
            -t podtrace-usdtdemo:ci \
            test/chainsaw/tests/usdt-capture/workload

      - name: Pull upstream workload images
        run: |
          for image in ${UPSTREAM_FIXTURE_IMAGES}; do
            pulled=0
            for i in 1 2 3; do
              if docker pull "$image"; then
                pulled=1
                break
              fi
              echo "::warning::pull attempt $i/3 for $image failed; retrying in 15s"
              sleep 15
            done
            if [ "$pulled" -ne 1 ]; then
              echo "::warning::could not pull $image after 3 attempts; the kubelet pulls it when a test needs it"
            fi
          done

      - name: Load images into kind
        run: |
          set -euo pipefail

          arch="$(dpkg --print-architecture)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          for image in \
            ghcr.io/gma1k/podtrace:ci \
            podtrace-h2demo:ci \
            podtrace-otlp-sink:ci \
            podtrace-h3curl:ci \
            podtrace-h3server:ci \
            podtrace-usdtdemo:ci \
            ${UPSTREAM_FIXTURE_IMAGES}
          do
            if ! docker image inspect "${image}" >/dev/null 2>&1; then
              echo "::warning::${image} is not available locally; not preloaded"
              continue
            fi
            archive="${tmp}/$(echo "${image}" | tr '/:' '__').tar"
            docker image save --platform "linux/${arch}" "${image}" -o "${archive}"
            kind load image-archive --name podtrace-chainsaw "${archive}"
            rm -f "${archive}"
          done

      - name: Install operator via Helm
        run: |
          timeout 420 helm install podtrace deploy/charts/podtrace \
            --namespace podtrace-system \
            --create-namespace \
            --set namespace.create=true \
            --set operator.enabled=true \
            --set image.repository=ghcr.io/gma1k/podtrace \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set agent.rolloutMaxUnavailable=100% \
            --wait --timeout 180s

          for _ in $(seq 1 60); do
            if kubectl -n podtrace-system get ds podtrace-agent >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl -n podtrace-system rollout status ds/podtrace-agent --timeout=180s

      - name: Run chainsaw suite
        env:
          CHAINSAW_PARALLEL: ${{ vars.CHAINSAW_PARALLEL || '2' }}
          CHAINSAW_SHARD: ${{ matrix.shard }}
        run: |
          make chainsaw \
            CHAINSAW_SHARD="${CHAINSAW_SHARD}" \
            CHAINSAW_PARALLEL="${CHAINSAW_PARALLEL}"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n podtrace-system get pods,ds,deploy,cm,secret 2>&1 || true
          kubectl -n podtrace-system describe pods 2>&1 | tail -200 || true
          kubectl -n podtrace-system logs deploy/podtrace-operator --tail=200 || true

      - name: Stop the agents before the cluster is deleted
        if: always()
        run: |
          kubectl -n podtrace-system scale deploy/podtrace-operator --replicas=0 || true
          kubectl -n podtrace-system delete ds -l podtrace.io/component=agent --wait=false || true
          kubectl -n podtrace-system wait --for=delete pod -l podtrace.io/component=agent --timeout=180s || true

  quickstart-smoke:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Preload kind node image
        uses: ./.github/actions/preload-kind-node

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          cluster_name: podtrace-quickstart
          config: ./test/chainsaw/kind-config.yaml
          version: v0.33.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.1

      - name: Build podtrace image
        run: |
          make docker-build IMAGE_TAG=ci

          arch="$(dpkg --print-architecture)"
          docker image save --platform "linux/${arch}" \
            ghcr.io/gma1k/podtrace:ci -o /tmp/podtrace-ci.tar
          kind load image-archive /tmp/podtrace-ci.tar \
            --name podtrace-quickstart
          rm -f /tmp/podtrace-ci.tar

      - name: Run quickstart smoke
        env:
          PODTRACE_IMAGE_REPO: ghcr.io/gma1k/podtrace
          PODTRACE_IMAGE_TAG: ci
        run: ./test/e2e/quickstart-smoke.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n podtrace-system describe deploy/podtrace-operator || true
          kubectl -n podtrace-system logs deploy/podtrace-operator --tail=100 || true
          kubectl -n podtrace-demo get podtracesession -o yaml || true

      - name: Stop the agents before the cluster is deleted
        if: always()
        run: |
          kubectl -n podtrace-system scale deploy/podtrace-operator --replicas=0 || true
          kubectl -n podtrace-system delete ds -l podtrace.io/component=agent --wait=false || true
          kubectl -n podtrace-system wait --for=delete pod -l podtrace.io/component=agent --timeout=180s || true
