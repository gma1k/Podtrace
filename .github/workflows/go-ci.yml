name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "deploy/charts/podtrace/templates/crds/**"
      - "Makefile"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "deploy/charts/podtrace/templates/crds/**"
      - "Makefile"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: GOTOOLCHAIN=auto go mod download

      - name: Run golangci-lint
        timeout-minutes: 5
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Check gofmt
        run: make fmt-check

      - name: Check go.mod tidiness
        run: GOTOOLCHAIN=auto go mod tidy -diff

      - name: Run govulncheck
        timeout-minutes: 5
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOTOOLCHAIN=auto govulncheck ./...

      - name: Build
        timeout-minutes: 5
        run: GOTOOLCHAIN=auto go build ./...

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          rm -f coverage.out coverage-*.out test-report.txt
          GOTOOLCHAIN=auto go test -v \
            -short -race -parallel=4 -timeout=10m \
            -coverprofile=coverage.out -covermode=atomic \
            ./cmd/... ./internal/... | tee test-report.txt

      - name: Exclude e2e-covered BPF code and generated client from unit coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            grep -vE 'github.com/gma1k/podtrace/internal/ebpf/probes/|github.com/gma1k/podtrace/pkg/client/' \
              coverage.out > coverage.filtered.out
            mv coverage.filtered.out coverage.out
          fi

      - name: Run integration suite
        timeout-minutes: 5
        run: |
          set -o pipefail
          GOTOOLCHAIN=auto go test -v \
            -tags=integration -timeout=5m \
            ./test/... | tee -a test-report.txt

      - name: Generate coverage report
        if: always()
        run: |
          if [ -f coverage.out ]; then
            GOTOOLCHAIN=auto go tool cover -html=coverage.out -o coverage.html || true
            GOTOOLCHAIN=auto go tool cover -func=coverage.out | tail -1 | tee -a test-report.txt
          else
            echo "::warning::Coverage file not found, skipping coverage report"
          fi

      - name: Check coverage threshold
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "::warning::Coverage file not found, skipping coverage check"
            exit 0
          fi
          COVERAGE=$(GOTOOLCHAIN=auto go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l 2>/dev/null || echo "1") )); then
            echo "Coverage $COVERAGE% is below 70% threshold"
            echo "::warning::Test coverage is below 70% threshold"
          else
            echo "Coverage $COVERAGE% meets threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: hashFiles('coverage.out') != ''
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Publish test and coverage badges
        if: always() && github.ref == 'refs/heads/main' && vars.BADGES_GIST_ID != ''
        uses: gaelgirodon/ci-badges-action@07a65145ff9feb271f426865f940977a94578ad4  # v1.10.0
        with:
          gist-id: ${{ vars.BADGES_GIST_ID }}
          token: ${{ secrets.GIST_TOKEN }}

  envtest:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: GOTOOLCHAIN=auto go mod download

      - name: Cache envtest control-plane assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/envtest-assets
          key: envtest-assets-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            envtest-assets-${{ runner.os }}-

      - name: Run envtest suite
        timeout-minutes: 15
        run: GOTOOLCHAIN=auto make envtest

  cross-compile:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: GOTOOLCHAIN=auto go build ./...

  benchmarks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: GOTOOLCHAIN=auto go mod download

      - name: Run benchmarks
        run: |
          GOTOOLCHAIN=auto go test -bench=. -benchmem ./... | tee benchmark.txt || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: benchmark.txt

  manifests-drift:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate CRDs, deepcopy, webhook reference, and clientset
        run: GOTOOLCHAIN=auto make manifests generate clientset

      - name: Fail on manifest drift
        run: |
          git add --intent-to-add -- \
            deploy/charts/podtrace/templates/crds hack/reference api/v1alpha1 pkg/client

          if ! git diff --exit-code -- \
            deploy/charts/podtrace/templates/crds hack/reference api/v1alpha1 pkg/client; then
            echo "::error::Generated code is stale. Run 'make manifests generate clientset' and commit the result." >&2
            exit 1
          fi

  crd-schema-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize the base revision's CRD manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/crd-base
          crd_dir=deploy/charts/podtrace/templates/crds
          # A CRD added by this PR has no base revision; absence is not a break.
          git ls-tree --name-only -z "${BASE_SHA}" "${crd_dir}/" \
            | while IFS= read -r -d '' path; do
                git show "${BASE_SHA}:${path}" > "/tmp/crd-base/$(basename "${path}")"
              done

      - name: Compare served schemas
        id: compare
        run: |
          set +e
          output=$(go run ./hack/crdcompat \
            -base /tmp/crd-base \
            -head deploy/charts/podtrace/templates/crds 2>&1)
          status=$?
          set -e
          echo "${output}"
          {
            echo "report<<CRDCOMPAT"
            echo "${output}"
            echo "CRDCOMPAT"
          } >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -gt 1 ]; then
            echo "::error::crdcompat failed to run" >&2
            exit 1
          fi

      - name: Assert served versions are schema-identical
        run: |
          go run ./hack/crdcompat -identity deploy/charts/podtrace/templates/crds

      - name: Require a recorded break
        if: steps.compare.outputs.status == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT: ${{ steps.compare.outputs.report }}
        run: |
          set -euo pipefail
          if git log --format=%B "${BASE_SHA}..${HEAD_SHA}" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "::notice::Breaking CRD schema change, declared by a BREAKING CHANGE footer."
            echo "${REPORT}"
            echo
            echo "Record it in the history table in docs/api-versioning.md before merging."
            exit 0
          fi
          echo "::error::This PR removes or retypes a field in a served CRD version:" >&2
          echo "${REPORT}" >&2
          echo >&2
          echo "Served versions are a compatibility promise — see docs/api-versioning.md." >&2
          echo "If the change is intended, add a BREAKING CHANGE footer to a commit in" >&2
          echo "this PR and add a row to the history table in docs/api-versioning.md." >&2
          exit 1
