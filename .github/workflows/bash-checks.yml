name: Bash Script Checks

on:
  pull_request:
    branches: ["**"]
    paths:
      - "**/*.sh"
      - "scripts/**"
      - "test/**/*.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            devscripts \
            shfmt \
            python3-venv
          python3 -m venv "$RUNNER_TEMP/bashate"
          "$RUNNER_TEMP/bashate/bin/pip" install --require-hashes -r .github/requirements-bashate.txt
          echo "$RUNNER_TEMP/bashate/bin" >> "$GITHUB_PATH"

      - name: Syntax Check
        run: |
          echo "Running bash syntax check..."
          for file in $(git ls-files '*.sh'); do
            echo "→ Checking syntax: $file"
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: |
          echo "Running strict ShellCheck..."
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --enable=all -x

      - name: Check for bashisms
        run: |
          echo "Checking for bashisms..."
          git ls-files -z '*.sh' | xargs -0 -r checkbashisms

      - name: Run bashate
        run: |
          echo "Running bashate..."
          command -v bashate
          git ls-files -z '*.sh' | xargs -0 -r bashate --ignore=E002,E003 || echo "bashate check completed with warnings"

      - name: Check formatting (shfmt)
        run: |
          echo "Checking formatting with shfmt..."
          shfmt -d . || {
            echo "Formatting issues found. To fix, run: shfmt -w ."
            echo "Or the workflow can auto-fix by running: shfmt -w ."
            exit 1
          }
