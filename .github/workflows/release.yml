name: Release

# Triggered by version tags (vX.Y.Z, vX.Y.Z-rc.N). Builds and signs the
# multi-arch container image, packages and pushes the Helm chart to GHCR
# OCI, and attaches a one-shot quickstart manifest to the GitHub Release.
#
# Note on chaining with release-please: tags pushed by release-please via
# the default GITHUB_TOKEN do not trigger downstream workflows (GitHub
# blocks token-driven event recursion). To produce a fully-automatic
# release, either:
#   (a) Manually re-run this workflow via "Run workflow" → tag ref, or
#   (b) Configure release-please-action with a PAT that has workflow scope
#       so its tag pushes trigger this workflow on their own.
# Option (a) requires zero setup; option (b) is the long-term cleanup.

on:
  push:
    tags: ["v*", "test*"]
  workflow_dispatch:
    inputs:
      olm_bundle_only:
        description: "Use to re-submit community-operators."
        type: boolean
        default: false
      version:
        description: "Version to submit when olm_bundle_only=true. Ignored otherwise; tag push uses github.ref_name."
        type: string
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/gma1k/podtrace
  CHART_PATH: deploy/charts/podtrace
  CHART_REPO: ghcr.io/gma1k/charts
  COSIGN_VERSION: v3.0.6
  HELM_VERSION: v4.3.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bpf-objects:
    if: ${{ !inputs.olm_bundle_only }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-26.04
            goarch: amd64
          - runner: ubuntu-26.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install BPF toolchain
        uses: ./.github/actions/setup-bpf-toolchain
      - name: Build native BPF object (full kernel BTF)
        run: make internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o BPF_GOARCH=${{ matrix.goarch }}
      - name: Refuse a stub fallback on the native runner
        run: |
          lines=$(wc -l < bpf/.generated/vmlinux.h)
          if [ "$lines" -lt 1000 ]; then
            echo "ERROR: ${{ matrix.goarch }} object fell back to the stub (vmlinux.h=$lines lines); a native runner must have full BTF" >&2
            exit 1
          fi
      - name: Attest the BPF object
        id: attest_bpf
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o

      - name: Stage the bundle beside the object
        run: |
          cp "${{ steps.attest_bpf.outputs.bundle-path }}" \
            "internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bpf-object-${{ matrix.goarch }}
          path: |
            internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o
            internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o.sigstore.json
          if-no-files-found: error
          retention-days: 1

  image:
    needs: bpf-objects
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !inputs.olm_bundle_only
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Generate BTF vmlinux.h for the build context
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic
          make bpf-btf-header
          wc -l bpf/.generated/vmlinux.h

      - name: Stage native BPF objects into the build context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bpf-object-*
          path: internal/ebpf/embedded
          merge-multiple: true

      - name: Verify the staged BPF objects
        uses: ./.github/actions/verify-bpf-objects

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            REQUIRE_BTF=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            cosign sign --yes "${t}@${DIGEST}"
          done

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !inputs.olm_bundle_only
    runs-on: ubuntu-26.04
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the scanned image digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::image job did not provide a digest to pin"
            exit 1
          fi
          chart="${CHART_PATH}/Chart.yaml"
          sed -i -E \
            "s|(image: ${IMAGE}:[0-9]+\.[0-9]+\.[0-9]+)( # x-release-please-version)?$|\1@${DIGEST}|" \
            "$chart"
          if ! grep -q "image: ${IMAGE}:.*@${DIGEST}" "$chart"; then
            echo "::error::failed to pin ${IMAGE} digest in ${chart}"
            grep -n "${IMAGE}" "$chart" || true
            exit 1
          fi
          echo "pinned ${IMAGE}@${DIGEST} for Artifact Hub"

      - id: package
        name: Lint, package, push
        run: |
          set -euo pipefail
          helm lint ${{ env.CHART_PATH }}
          mkdir -p dist
          helm package ${{ env.CHART_PATH }} -d dist/
          tgz=$(find dist -maxdepth 1 -name 'podtrace-*.tgz' | sort | head -n1)
          version=$(helm show chart ${{ env.CHART_PATH }} | awk '/^version:/{print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          helm push "$tgz" oci://${{ env.CHART_REPO }} 2>&1 | tee push.log
          digest=$(grep '^Digest:' push.log | awk '{print $2}')
          if [ -z "$digest" ]; then
            echo "::error::could not extract chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign chart (keyless)
        run: |
          cosign sign --yes \
            "${{ env.CHART_REPO }}/podtrace@${{ steps.package.outputs.digest }}"

      - name: Attest the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/podtrace
          subject-digest: ${{ steps.package.outputs.digest }}
          push-to-registry: true

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1

      - name: Push Artifact Hub verification artifact
        working-directory: ${{ env.CHART_PATH }}
        run: |
          set -euo pipefail
          oras push \
            ${{ env.CHART_REPO }}/podtrace:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  quickstart:
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !inputs.olm_bundle_only
    runs-on: ubuntu-26.04
    needs: chart
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Render quickstart manifests
        run: |
          set -euo pipefail
          mkdir -p dist
          # Same renderer test/e2e/quickstart-smoke.sh uses, so the released
          # artifact is produced by the code CI exercises on every PR.
          ./hack/render-quickstart.sh "${{ env.CHART_PATH }}" dist/quickstart.yaml
          cp deploy/quickstart-sample.yaml dist/quickstart-demo.yaml
          echo "Rendered $(wc -l < dist/quickstart.yaml) + $(wc -l < dist/quickstart-demo.yaml) lines"

      - name: Compute checksum
        run: |
          cd dist
          sha256sum quickstart.yaml > quickstart.yaml.sha256
          sha256sum quickstart-demo.yaml > quickstart-demo.yaml.sha256

      - name: Attest the rendered manifests
        id: attest_quickstart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/quickstart.yaml
            dist/quickstart-demo.yaml

      - name: Stage the attestation bundle for release
        run: cp "${{ steps.attest_quickstart.outputs.bundle-path }}" dist/quickstart.sigstore.json

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/quickstart.yaml
            dist/quickstart.yaml.sha256
            dist/quickstart-demo.yaml
            dist/quickstart-demo.yaml.sha256
            dist/quickstart.sigstore.json
          fail_on_unmatched_files: true

  cli:
    needs: bpf-objects
    if: ${{ !inputs.olm_bundle_only }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF toolchain
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Verify the release builds against full kernel BTF
        run: |
          make bpf-btf-header
          lines=$(wc -l < bpf/.generated/vmlinux.h)
          if [ "$lines" -lt 1000 ]; then
            echo "ERROR: vmlinux.h has only $lines lines — stub fallback; refusing to release stub-built binaries" >&2
            exit 1
          fi

      - name: Stage native BPF objects (reused by make release)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bpf-object-*
          path: internal/ebpf/embedded
          merge-multiple: true

      - name: Verify the staged BPF objects
        uses: ./.github/actions/verify-bpf-objects

      - name: Build CLI tarballs (linux+darwin x amd64+arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="${VERSION}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign checksums.txt (cosign keyless)
        working-directory: release
        run: |
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      # Attest the tarballs themselves, not checksums.txt, so that
      # `gh attestation verify podtrace_linux_amd64.tar.gz` is a one-step check
      # instead of "verify the checksum file, then hand-match the hash".
      - name: Attest the CLI tarballs
        id: attest_cli
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/podtrace_*.tar.gz

      - name: Stage the attestation bundle for release
        run: cp "${{ steps.attest_cli.outputs.bundle-path }}" release/podtrace.sigstore.json

      - name: Attach tarballs + checksums + signature to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            release/podtrace_*.tar.gz
            release/checksums.txt
            release/checksums.txt.sigstore.json
            release/podtrace.sigstore.json
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'test') || contains(github.ref_name, '-') }}

      - name: Update plugin manifest in krew-index
        id: krew_submit
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'test')
        continue-on-error: true
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3  # v0.0.51

      - name: Treat existing krew-index PR as idempotent success
        if: |
          steps.krew_submit.outcome == 'failure' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="gma1k-podtrace-podtrace-${VERSION}"
          existing=$(gh api repos/kubernetes-sigs/krew-index/pulls --paginate \
            --jq "[.[] | select(.head.ref == \"${branch}\")] | length")
          if [ "${existing:-0}" -eq 0 ]; then
            echo "::error::krew-release-bot failed and no PR exists upstream for ${VERSION}"
            exit 1
          fi
          echo "krew-index PR for ${VERSION} already exists — treating bot failure as idempotent re-run"

  olm-bundle:
    needs: image
    if: |
      !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') && (
        (github.event_name == 'workflow_dispatch' && inputs.olm_bundle_only && startsWith(inputs.version, 'v') && !contains(inputs.version, '-'))
        || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'test'))
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      VERSION: ${{ (github.event_name == 'workflow_dispatch' && inputs.olm_bundle_only) && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Compute previous version from upstream catalog
        id: prev
        env:
          GH_TOKEN: ${{ secrets.OPERATORHUB_PAT }}
        run: |
          set -euo pipefail
          current="${VERSION#v}"
          prev=$(gh api "repos/k8s-operatorhub/community-operators/contents/operators/podtrace" \
                  --jq '[.[] | select(.type=="dir") | .name] | map(select(test("^[0-9]"))) | sort_by(split(".") | map(tonumber)) | last' \
                  2>/dev/null || echo "")
          if [[ "${prev}" == "${current}" ]]; then
            echo "::error::upstream already has ${current}; refusing to re-submit"
            exit 1
          fi
          echo "previous=${prev}" >> "$GITHUB_OUTPUT"
          echo "Computed PREVIOUS_VERSION=${prev:-<none>} (current=${current})"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Submit bundle to community-operators
        env:
          GH_TOKEN: ${{ secrets.OPERATORHUB_PAT }}
          PREVIOUS_VERSION: ${{ steps.prev.outputs.previous }}
        run: ./scripts/submit-olm-bundle.sh
