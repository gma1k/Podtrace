name: Security - CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read

    runs-on: ubuntu-26.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          trap-caching: false

      - name: Install BPF toolchain
        if: matrix.language == 'cpp'
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Run gosec security scanner
        if: matrix.language == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -fmt sarif -out gosec-results.sarif -exclude-dir=test ./... || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open("gosec-results.sarif") as f:
                  sarif = json.load(f)
              for run in sarif.get("runs", []):
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      rels = rule.get("relationships", [])
                      rule["relationships"] = [
                          r if isinstance(r, dict) else {"target": {"id": str(r), "toolComponent": {"name": "gosec"}}}
                          for r in rels
                      ]
              with open("gosec-results.sarif", "w") as f:
                  json.dump(sarif, f)
          except Exception as e:
              print(f"SARIF normalization warning: {e}", file=sys.stderr)
          EOF

      - name: Upload gosec SARIF results
        if: matrix.language == 'go'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Build eBPF C
        if: matrix.language == 'cpp'
        run: |
          make internal/ebpf/embedded/podtrace.amd64.bpf.o BPF_GOARCH=amd64

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0

  govulncheck:
    name: govulncheck
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  semgrep:
    name: semgrep
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install semgrep
        run: pipx install semgrep==1.173.0

      - name: Run semgrep (SARIF, advisory)
        run: |
          semgrep scan \
            --config p/golang --config p/dockerfile \
            --config p/github-actions --config p/secrets \
            --config .semgrep/ \
            --sarif --output semgrep.sarif --metrics=off . || true
          test -s semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Upload semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: trivy
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Trivy
        run: |
          ver="0.74.0"
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64) asset="trivy_${ver}_Linux-64bit.tar.gz"; want="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a" ;;
            arm64) asset="trivy_${ver}_Linux-ARM64.tar.gz"; want="b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5" ;;
            *) echo "::error::no pinned Trivy for arch ${arch}"; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${ver}/${asset}" -o "${tmp}/trivy.tgz"
          echo "${want}  ${tmp}/trivy.tgz" | sha256sum -c -
          tar -C "${tmp}" -xzf "${tmp}/trivy.tgz" trivy
          sudo install -m0755 "${tmp}/trivy" /usr/local/bin/trivy
          rm -rf "${tmp}"
          trivy --version

      - name: Trivy vulnerability and secret scan (SARIF, advisory)
        run: |
          trivy fs --scanners vuln,secret \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --exit-code 0 --no-progress .

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  cppcheck:
    name: cppcheck
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      - name: Run cppcheck over bpf/ (advisory)
        run: |
          cppcheck --enable=warning,portability,performance --inline-suppr \
            --std=c11 -D__TARGET_ARCH_x86 -I bpf \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --suppress=unusedStructMember --suppress=unknownMacro \
            --xml --xml-version=2 bpf/ 2> cppcheck.xml || true

      - name: Convert cppcheck report to SARIF
        run: python3 .github/scripts/cppcheck_to_sarif.py cppcheck.xml cppcheck.sarif

      - name: Upload cppcheck SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck
