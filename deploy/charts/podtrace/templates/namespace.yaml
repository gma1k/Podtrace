{{/*
namespace-bootstrap — idempotent creation + PSA-labeling of the system
namespace via a pre-install/pre-upgrade hook Job.

Why a Job instead of a templated Namespace resource:

  Templating a Namespace as a regular release manifest conflicts with
  both common install paths:

    1. `helm install --create-namespace` creates the namespace BEFORE
       rendering templates, but without Helm ownership labels. The
       chart's Namespace template then tries to "import" it and Helm
       refuses with "invalid ownership metadata".

    2. Pre-creating the namespace by hand has the same failure mode.

  A pre-install hook Job that runs `kubectl apply` on the Namespace
  sidesteps both problems. `kubectl apply` is the idempotent operation —
  it creates the namespace if missing and patches labels if existing,
  with no Helm ownership check involved. The Job (and its SA/RBAC) lands
  in .Release.Namespace, which Helm creates before any hook runs (with
  --create-namespace, which NOTES requires). It deliberately does NOT
  use kube-system: managed platforms such as GKE Autopilot forbid
  creating resources there, which broke the install outright.

  Weight -100 puts this before the crd-labeler hook (-20) and, being a
  pre-install/pre-upgrade hook, ahead of Helm's main apply phase where the
  CRD templates and the operator land — so the target namespace exists by
  the time anything references it.

  The hook-delete-policy clears the Job after success, so it does not
  accumulate across upgrades. The Namespace itself persists — there is
  no delete-policy on the manifest applied inside the Job.
*/}}
{{- if .Values.namespace.create }}
{{- $systemNamespace := include "podtrace.systemNamespace" . }}
{{- /*
  The chart's labels are merged over the user's, so a user value for a
  pod-security.kubernetes.io/* key cannot produce a duplicate key or relax the
  privileged level the agent DaemonSet and session Jobs need
  (CAP_BPF / CAP_SYS_ADMIN / CAP_PERFMON). User-namespace CRs stay under
  restricted PSA; only implementation pods land here.
*/}}
{{- $labels := merge (dict
      "app.kubernetes.io/name" "podtrace"
      "app.kubernetes.io/instance" .Release.Name
      "app.kubernetes.io/managed-by" .Release.Service
      "app.kubernetes.io/part-of" "podtrace"
      "pod-security.kubernetes.io/enforce" "privileged"
      "pod-security.kubernetes.io/audit" "privileged"
      "pod-security.kubernetes.io/warn" "privileged")
    (.Values.namespace.labels | default dict) }}
{{- $metadata := dict "name" $systemNamespace "labels" $labels }}
{{- with .Values.namespace.annotations }}
{{- $_ := set $metadata "annotations" . }}
{{- end }}
{{- $namespaceManifest := dict "apiVersion" "v1" "kind" "Namespace" "metadata" $metadata }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: namespace-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: namespace-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # create cannot be narrowed by name; everything that changes an existing
  # namespace is limited to the system namespace, so this ServiceAccount
  # cannot relabel another namespace privileged.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ $systemNamespace | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: namespace-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "podtrace.fullname" . }}-namespace-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: namespace-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podtrace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: namespace-bootstrap
    spec:
      serviceAccountName: {{ include "podtrace.fullname" . }}-namespace-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: {{ .Values.crds.labelerImage | default "alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4" }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            # The manifest is rendered by Helm as one JSON line inside a
            # quoted heredoc, so nothing in a label or annotation value is
            # expanded by the shell.
            - |
              set -eu
              kubectl apply -f - <<'PODTRACE_NAMESPACE_MANIFEST'
              {{ $namespaceManifest | toJson }}
              PODTRACE_NAMESPACE_MANIFEST
              echo "namespace-bootstrap: done"
{{- end }}
