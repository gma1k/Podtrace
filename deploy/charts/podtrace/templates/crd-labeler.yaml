{{/*
crd-labeler — one-time-per-cluster CRD ownership migration.

Earlier the chart shipped its CRDs in Helm's `crds/`
directory, which installs once at first `helm install` and never
updates afterward. We have since moved the CRDs into `templates/crds/`
as regular chart resources, so Helm propagates schema changes on upgrade.

The wrinkle: clusters already running an older chart version carry
CRDs that lack the Helm ownership labels (`app.kubernetes.io/managed-by=Helm`
and the meta.helm.sh/release-* annotations). When Helm's apply reaches
the same-named CRD template it refuses with "invalid ownership
metadata" because Helm will not silently take over a resource somebody
else created.

This Job runs as a pre-install/pre-upgrade hook at weight -20, before
Helm's main apply phase where the CRD templates land, and patches the
six podtrace.io CRDs with the ownership labels the chart expects, so
Helm's subsequent apply adopts and updates them cleanly.
After that first upgrade the CRDs are Helm-owned forever; this Job is
a no-op on every subsequent run.

Users who manage their CRDs out-of-band can disable the labeler via .Values.crds.adopt=false.
*/}}
{{- if and .Values.crds.install .Values.crds.adopt }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "podtrace.fullname" . }}-crd-labeler
  namespace: {{ include "podtrace.systemNamespace" . }}
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: crd-labeler
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtrace.fullname" . }}-crd-labeler
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: crd-labeler
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # Only the six podtrace CRDs: an unscoped patch would let anything running
  # as this ServiceAccount rewrite any CRD's conversion webhook.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - podtraces.podtrace.io
      - podtracesessions.podtrace.io
      - podtraceschedules.podtrace.io
      - applicationtraces.podtrace.io
      - exporterconfigs.podtrace.io
      - tracerconfigs.podtrace.io
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtrace.fullname" . }}-crd-labeler
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: crd-labeler
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtrace.fullname" . }}-crd-labeler
subjects:
  - kind: ServiceAccount
    name: {{ include "podtrace.fullname" . }}-crd-labeler
    namespace: {{ include "podtrace.systemNamespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "podtrace.fullname" . }}-crd-labeler
  namespace: {{ include "podtrace.systemNamespace" . }}
  labels:
    app.kubernetes.io/name: podtrace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: crd-labeler
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podtrace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: crd-labeler
    spec:
      serviceAccountName: {{ include "podtrace.fullname" . }}-crd-labeler
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: {{ .Values.crds.labelerImage | default "alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4" }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # All SIX CRDs: the adoption list previously missed
              # podtraceschedules and applicationtraces, so Helm hit
              # "invalid ownership metadata" on upgrade-over-quickstart.
              CRDS="podtraces.podtrace.io podtracesessions.podtrace.io podtraceschedules.podtrace.io applicationtraces.podtrace.io exporterconfigs.podtrace.io tracerconfigs.podtrace.io"
              RELEASE="{{ .Release.Name }}"
              RELEASE_NS="{{ .Release.Namespace }}"
              for crd in $CRDS; do
                if ! kubectl get crd "$crd" >/dev/null 2>&1; then
                  echo "crd-labeler: $crd does not exist yet — Helm will create it"
                  continue
                fi
                existing_release=$(kubectl get crd "$crd" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                if [ "$existing_release" = "$RELEASE" ]; then
                  echo "crd-labeler: $crd already owned by release $RELEASE — skipping"
                  continue
                fi
                if [ -n "$existing_release" ] && [ "$existing_release" != "$RELEASE" ]; then
                  echo "crd-labeler: WARNING: $crd is owned by another Helm release ($existing_release); not stealing"
                  continue
                fi
                echo "crd-labeler: adopting $crd for release $RELEASE"
                kubectl label crd "$crd" \
                  "app.kubernetes.io/managed-by=Helm" --overwrite
                kubectl annotate crd "$crd" \
                  "meta.helm.sh/release-name=$RELEASE" \
                  "meta.helm.sh/release-namespace=$RELEASE_NS" --overwrite
              done
              echo "crd-labeler: done"
{{- end }}