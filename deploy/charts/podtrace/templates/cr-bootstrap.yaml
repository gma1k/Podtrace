{{/*
cr-bootstrap — chart-side application of the default TracerConfig and
optional starter ExporterConfig.

Why a Job instead of regular templates:

  Helm validates every rendered manifest against the cluster's
  RESTMapper BEFORE applying anything. On a fresh cluster the
  podtrace.io CRDs are about to be installed by the same release, but
  RESTMapper doesn't know them yet, so any `kind: TracerConfig`
  manifest in templates/ fails Helm's manifest-build step:

    Error: INSTALLATION FAILED: unable to build kubernetes objects
    from release manifest: resource mapping not found for name:
    "default" namespace: "" from "": no matches for kind "TracerConfig"
    in version "podtrace.io/v1alpha1"

  Two-stage install via Helm's special `crds/` directory works around
  this, but `crds/` files are install-only and never update on
  `helm upgrade`. We deliberately moved CRDs into templates/crds/ to
  fix that, so the same workaround is no longer available.

  Stuffing the CR YAML into a ConfigMap and applying it from a Job at
  post-install/post-upgrade sidesteps both problems: Helm never decodes
  the inner YAML against RESTMapper (it's just data in a ConfigMap),
  and the Job's kubectl-apply runs AFTER the CRDs have been installed
  and the apiserver has registered the new types.

  The operator also self-bootstraps a TracerConfig if none exists
  (see internal/operator/bootstrap.go) so OLM and raw-kubectl install
  paths — which don't run Helm hooks — still get a working
  out-of-the-box state. On Helm installs the Job and the operator's
  bootstrap may race, but both target the SAME name (the operator
  reads it from PODTRACE_BOOTSTRAP_TC_NAME, set to tracerConfig.name),
  so whichever runs second is a no-op (AlreadyExists) — they converge
  on one object instead of leaving a stray "default". The Job's
  kubectl-apply then reconciles that object to the values.yaml-driven
  spec, which takes precedence.

  Helm-uninstall semantics: hook resources (this Job, its ConfigMap,
  its RBAC) self-clean via hook-delete-policy. The applied
  TracerConfig and ExporterConfig persist — the right semantics for
  long-lived cluster config that should survive a chart uninstall.
*/}}
{{- if .Values.operator.enabled }}
{{- $tcEnabled := .Values.tracerConfig.create }}
{{- $ecEnabled := .Values.examples.exporterconfig.enabled }}
{{- if or $tcEnabled $ecEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
  namespace: {{ include "podtrace.systemNamespace" . }}
  labels:
    {{- include "podtrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: cr-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  {{- if $tcEnabled }}
  tracerconfig.yaml: |
    apiVersion: podtrace.io/v1alpha1
    kind: TracerConfig
    metadata:
      name: {{ .Values.tracerConfig.name | default "default" }}
      labels:
        app.kubernetes.io/name: podtrace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: tracerconfig
    spec:
      image: {{ include "podtrace.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      systemNamespace: {{ include "podtrace.systemNamespace" . | quote }}
      maxConcurrentSessionsPerNode: {{ .Values.session.maxConcurrentSessionsPerNode }}
      {{- if .Values.agent.btfMode }}
      btfMode: {{ .Values.agent.btfMode }}
      {{- end }}
      {{- with .Values.agent.btfSource }}
      btfSource:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      agent:
        {{- with .Values.agent.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.agent.priorityClassName }}
        priorityClassName: {{ .Values.agent.priorityClassName | quote }}
        {{- end }}
        {{- if .Values.agent.eventBufferSize }}
        eventBufferSize: {{ .Values.agent.eventBufferSize }}
        {{- end }}
        {{- if .Values.agent.statusReportInterval }}
        statusReportInterval: {{ .Values.agent.statusReportInterval | quote }}
        {{- end }}
        {{- with .Values.agent.logLevel }}
        logLevel: {{ . | quote }}
        {{- end }}
        dnsPacketCapture: {{ .Values.agent.dnsPacketCapture }}
        dnsFullAnswers: {{ .Values.agent.dnsFullAnswers }}
        usdt: {{ .Values.agent.usdt }}
        uprobeMulti: {{ .Values.agent.uprobeMulti }}
        continuousProfiling: {{ .Values.agent.continuousProfiling }}
        sockOpsRTT: {{ .Values.agent.sockOpsRTT }}
        {{- with .Values.agent.rolloutMaxUnavailable }}
        rolloutMaxUnavailable: {{ . | quote }}
        {{- end }}
        {{- if .Values.agent.alerting.enabled }}
        alerting:
          enabled: true
          {{- with .Values.agent.alerting.webhookURLSecretRef }}
          webhookURLSecretRef:
            name: {{ .name | quote }}
            key: {{ .key | default "url" | quote }}
          {{- end }}
          {{- with .Values.agent.alerting.webhookURL }}
          webhookURL: {{ . | quote }}
          {{- end }}
          allowInsecureWebhook: {{ .Values.agent.alerting.allowInsecureWebhook }}
        {{- end }}
        {{- /* Both switches are always written: the CRD defaults them to
        on, so leaving a block out would turn it on, not off. */}}
        metrics:
          enabled: {{ .Values.agent.metrics.enabled }}
          {{- if .Values.agent.metrics.enabled }}
          {{- with .Values.agent.metrics.excludeNamespaces }}
          excludeNamespaces:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.agent.metrics.seriesBudget }}
          seriesBudget: {{ .Values.agent.metrics.seriesBudget }}
          {{- end }}
          nativeHistograms: {{ .Values.agent.metrics.nativeHistograms }}
          semanticConventions: {{ .Values.agent.metrics.semanticConventions }}
          kernelAggregation: {{ .Values.agent.metrics.kernelAggregation }}
          filesystem: {{ .Values.agent.metrics.filesystem }}
          {{- if .Values.agent.metrics.attributeCardinality }}
          attributeCardinality: {{ .Values.agent.metrics.attributeCardinality }}
          {{- end }}
          {{- if or .Values.agent.metrics.labels.pod .Values.agent.metrics.labels.process }}
          labels:
            pod: {{ .Values.agent.metrics.labels.pod }}
            process: {{ .Values.agent.metrics.labels.process }}
          {{- end }}
          inspections:
            enabled: {{ .Values.agent.metrics.inspections.enabled }}
            {{- if .Values.agent.metrics.inspections.enabled }}
            {{- with .Values.agent.metrics.inspections.interval }}
            interval: {{ . | quote }}
            {{- end }}
            alerts: {{ .Values.agent.metrics.inspections.alerts }}
            {{- if .Values.agent.metrics.inspections.budget }}
            budget: {{ .Values.agent.metrics.inspections.budget }}
            {{- end }}
            {{- with .Values.agent.metrics.inspections.holdTime }}
            holdTime: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.metrics.inspections.thresholds }}
            thresholds:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- end }}
          {{- end }}
      session:
        {{- with .Values.session.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ttlSecondsAfterFinished: {{ .Values.session.ttlSecondsAfterFinished }}
        activeDeadlineOffset: {{ .Values.session.activeDeadlineOffset | quote }}
        backoffLimit: {{ .Values.session.backoffLimit }}
        sidecarUploader: {{ .Values.tracerConfig.sidecarUploader }}
        {{- with .Values.session.maxDuration }}
        maxDuration: {{ . | quote }}
        {{- end }}
      {{- if .Values.tracerConfig.redaction.enabled }}
      redaction:
        enabled: true
        redactDNSNames: {{ .Values.tracerConfig.redaction.redactDNSNames }}
        {{- with .Values.tracerConfig.redaction.customRules }}
        customRules:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with (.Values.tracerConfig.capture).headers }}
      capture:
        headers:
          {{- toYaml . | nindent 10 }}
      {{- end }}
  {{- end }}
  {{- if $ecEnabled }}
  exporterconfig.yaml: |
    apiVersion: podtrace.io/v1alpha1
    kind: ExporterConfig
    metadata:
      name: {{ .Values.examples.exporterconfig.name | default "starter-otlp" }}
      namespace: {{ .Values.examples.exporterconfig.namespace | default "default" }}
      labels:
        app.kubernetes.io/name: podtrace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: example
    spec:
      type: otlp
      otlp:
        endpoint: {{ .Values.examples.exporterconfig.endpoint | quote }}
        protocol: {{ .Values.examples.exporterconfig.protocol | default "http" }}
        insecure: {{ .Values.examples.exporterconfig.insecure }}
      {{- if .Values.examples.exporterconfig.samplePercent }}
      samplePercent: {{ .Values.examples.exporterconfig.samplePercent }}
      {{- end }}
      {{- if .Values.examples.exporterconfig.synthesizeSpans }}
      synthesizeSpans: true
      {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
  namespace: {{ include "podtrace.systemNamespace" . }}
  labels:
    {{- include "podtrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: cr-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
  labels:
    {{- include "podtrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: cr-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["podtrace.io"]
    resources: ["tracerconfigs", "exporterconfigs"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
  labels:
    {{- include "podtrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: cr-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "podtrace.fullname" . }}-cr-bootstrap
    namespace: {{ include "podtrace.systemNamespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "podtrace.fullname" . }}-cr-bootstrap
  namespace: {{ include "podtrace.systemNamespace" . }}
  labels:
    {{- include "podtrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: cr-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podtrace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cr-bootstrap
    spec:
      serviceAccountName: {{ include "podtrace.fullname" . }}-cr-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: {{ .Values.crds.labelerImage | default "alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4" }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for f in /crs/*.yaml; do
                [ -e "$f" ] || continue
                echo "cr-bootstrap: applying $f"
                kubectl apply -f "$f"
              done
              echo "cr-bootstrap: done"
          volumeMounts:
            - name: crs
              mountPath: /crs
              readOnly: true
      volumes:
        - name: crs
          configMap:
            name: {{ include "podtrace.fullname" . }}-cr-bootstrap
{{- end }}
{{- end }}
