apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: trigger-flight-recorder
spec:
  namespace: trigger-flight-recorder-test
  concurrent: false
  description: |
    End-to-end verification — the "flight recorder": a PodTraceSchedule in
    trigger mode creates a PodTraceSession in response to an agent-detected
    resource-limit alert, targeting the pod that alerted.

    Setup:
      1. Enable agent alerting on the cluster TracerConfig so alerts are
         produced and the Kubernetes-Event sink is active, and wait for the
         agent DaemonSet to roll to the new configuration.
      2. Deploy a memory-hog workload sitting near its memory limit, a
         lightweight continuous PodTrace over it (alert detection only runs
         for traced pods), and a PodTraceSchedule whose trigger fires on a
         ResourceAlert of at least warning severity for that pod.

    Exercise:
      3. The agent's resource monitor detects the breach, raises an alert,
         and the event sink records it as a PodtraceAlert Event on the pod.
         The operator watches that Event and materialises a session.

    Assertions:
      4. A PodTraceSession owned by the schedule exists, annotated
         podtrace.io/triggered-by=ResourceAlert, targeting the memhog pod
         via podRefs (the template selector is narrowed to the alerting pod).

    The polinux/stress image is preloaded into the kind nodes by the
    chainsaw workflow. Trigger mode requires agent alerting; this test
    enables it and restores the default on cleanup.
  timeouts:
    apply: 60s
    assert: 240s
    delete: 60s
    cleanup: 120s
  steps:
    - name: enable-alerting
      try:
        - script:
            content: |
              saved=$(kubectl get tracerconfig default -o jsonpath='{.spec.agent.alerting}')
              kubectl -n "${NAMESPACE}" create configmap tracerconfig-before \
                --from-literal=alerting="${saved}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        - patch:
            resource:
              apiVersion: podtrace.io/v1alpha1
              kind: TracerConfig
              metadata:
                name: default
              spec:
                agent:
                  alerting:
                    enabled: true
        - script:
            timeout: 330s
            content: sh ../../lib/agents-converged.sh
      cleanup:
        - script:
            content: |
              if ! kubectl -n "${NAMESPACE}" get configmap tracerconfig-before >/dev/null 2>&1; then
                echo "no snapshot taken, so the tracerconfig was never changed"
                exit 0
              fi
              saved=$(kubectl -n "${NAMESPACE}" get configmap tracerconfig-before \
                -o jsonpath='{.data.alerting}')
              if [ -n "${saved}" ]; then
                kubectl patch tracerconfig default --type=json \
                  -p "[{\"op\":\"replace\",\"path\":\"/spec/agent/alerting\",\"value\":${saved}}]"
              else
                kubectl patch tracerconfig default --type=json \
                  -p '[{"op":"remove","path":"/spec/agent/alerting"}]' || true
              fi
              echo "spec.agent.alerting restored to what the test found"

    - name: deploy-workload-and-trigger
      try:
        - apply:
            file: ./resources.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: memhog
              status:
                readyReplicas: 1

    - name: assert-triggered-session
      try:
        - assert:
            file: ./assert-triggered.yaml
