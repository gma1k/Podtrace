apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: psa-enforcement
spec:
  description: |
    The chart's namespace-bootstrap hook labels podtrace-system
    enforce=privileged, and that admits agent-style pods (privileged +
    CAP_BPF + hostPID). The same pod spec must be rejected by PodSecurity
    in a restricted namespace, proving the label is doing real work.

    CI installs the chart with namespace.create=true and does not label
    the namespace itself, so the label asserted first is the hook's. kind
    enforces nothing on an unlabelled namespace, so admission alone would
    pass without it.
  timeouts:
    apply: 30s
    assert: 30s
  steps:
    - name: privileged-namespace-admits
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: podtrace-system
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
        - apply:
            file: ./privileged-pod-system.yaml
        - assert:
            file: ./assert-system-pod-admitted.yaml
      finally:
        - delete:
            ref:
              apiVersion: v1
              kind: Pod
              name: psa-probe
              namespace: podtrace-system

    - name: restricted-namespace-rejects
      try:
        - apply:
            file: ./restricted-namespace.yaml
        - apply:
            file: ./privileged-pod-restricted.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'violates PodSecurity')): true
      finally:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: psa-restricted-probe