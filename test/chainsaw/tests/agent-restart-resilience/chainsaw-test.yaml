apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agent-restart-resilience
spec:
  concurrent: false
  description: |
    Restart the agent DaemonSet; existing PodTrace CRs must stay
    Reconciled and the per-node status array reappears post-restart.

    SCOPE: control-plane only by choice. The agent runs the real eBPF
    backend, but this test does NOT compare pre/post event counts —
    that would make it timing-sensitive. It asserts the control plane
    survives a restart; resource-alert covers the agent data path.
  timeouts:
    apply: 30s
    assert: 120s
    exec: 300s
  steps:
    - name: setup
      try:
        - apply:
            file: ./resources.yaml
        - assert:
            file: ./assert-initial-ready.yaml

    - name: rollout-restart-agent
      description: |
        The step budget has to outlast the rollout it waits on. A
        three-node DaemonSet rolling one pod at a time takes over a
        minute on a loaded cluster, and without an explicit budget the
        script was killed at about 70s with `signal: killed` — after
        `rollout status` had already reported success, which made it look
        like a product flake rather than arithmetic.
      try:
        - script:
            timeout: 240s
            content: |
              set -eu
              kubectl -n podtrace-system rollout restart ds/podtrace-agent
              kubectl -n podtrace-system rollout status ds/podtrace-agent --timeout=180s

    - name: cr-still-reconciled
      try:
        - assert:
            file: ./assert-post-restart.yaml

    - name: node-status-reappears
      description: |
        The restarted agents must report on the PodTrace again, not leave
        the entry the old agents wrote standing. The cut-off is taken once
        the rollout has finished, when every old agent is gone, so only a
        new agent can write a heartbeat at or after it. Agents report every
        30s.
      try:
        - script:
            timeout: 150s
            content: |
              set -eu
              kubectl -n podtrace-system rollout status ds/podtrace-agent --timeout=60s >/dev/null
              cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              for _ in $(seq 1 45); do
                beats=$(kubectl -n "${NAMESPACE}" get podtrace restart-pt \
                  -o jsonpath='{range .status.nodeStatus[*]}{.lastHeartbeat}{"\n"}{end}')
                for beat in ${beats}; do
                  newest=$(printf '%s\n%s\n' "${cutoff}" "${beat}" | sort | tail -n 1)
                  if [ "${newest}" = "${beat}" ]; then
                    echo "a restarted agent reported at ${beat} (rollout finished ${cutoff})"
                    exit 0
                  fi
                done
                sleep 2
              done
              echo "FAIL: no nodeStatus heartbeat at or after ${cutoff}; the restarted agents never reported" >&2
              kubectl -n "${NAMESPACE}" get podtrace restart-pt -o jsonpath='{.status.nodeStatus}' >&2
              exit 1