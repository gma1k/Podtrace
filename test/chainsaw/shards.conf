# Shard assignment for the chainsaw e2e matrix.
#
# Format: <shard> <test-directory-name>, one per line. Every directory under
# tests/ that holds a chainsaw-test.yaml must appear exactly once;
# shards_test.go enforces that, so a newly added test fails `make test-unit`
# rather than silently never running in CI.
#
# Why explicit lists rather than chainsaw's own --shard-count: that flag
# slices the alphabetically sorted test list into contiguous chunks. Measured
# on this suite it distributes the eight `concurrent: false` tests 2/1/3/2 and
# lands metrics-plane, otlp-metrics-push and multi-tracerconfig-fleets in one
# shard. A `concurrent: false` test runs alone, so its cost is serial whatever
# --parallel says, and those four metrics tests are 88% of the serial chain.
# They are deliberately in four different shards here.

# shard 1: 409s (exclusive: continuous-inspections, dns-failures,
# trigger-flight-recorder)
1 applicationtrace-lifecycle
1 continuous-inspections
1 dns-failures
1 exporter-degraded-surface
1 exporter-non-otlp
1 h2-capture
1 http-capture
1 psa-enforcement
1 trigger-flight-recorder

# shard 2: 409s (exclusive: kernel-aggregation)
2 continuous-cr-lifecycle
2 h3-adapter-capture
2 h3-nghttp3-server
2 kernel-aggregation
2 namespace-selector
2 schedule-cr-lifecycle
2 usdt-capture

# shard 3: 409s (exclusive: metrics-plane, multi-tracerconfig-fleets,
# resource-alert, session-fleet-redaction)
3 cross-version-roundtrip
3 exporter-credential-rotation
3 metrics-plane
3 multi-tracerconfig-fleets
3 policy-wiring-e2e
3 resource-alert
3 session-fleet-redaction

# shard 4: 408s (exclusive: agent-restart-resilience, objectstore-upload,
# otlp-metrics-push)
4 agent-restart-resilience
4 dns-capture
4 exporterconfig-status
4 multi-cr-shared-agent
4 objectstore-upload
4 otlp-metrics-push
4 session-cr-lifecycle
2 btf-file-mode
2 tracerconfig-schema-defaults
